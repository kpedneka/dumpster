# Separate Fly app for the consolidated ML inference service.
#
# This can't be a process group on the main "dumpster" app (fly.toml):
# process groups within one Fly app share a single built image, and this
# service needs a completely different base (python:3.11-slim + the ML
# stack) from api/worker's lean Go/Alpine runtime image. A separate app in
# the same Fly organization is the standard way to run a second image,
# reachable from api/worker over Fly's private network (WireGuard-based
# 6PN) as "dumpster-inference.internal:8000" — no public exposure needed or
# configured here, since nothing outside this Fly org ever calls it
# directly. Deploy with: fly deploy --config fly.inference.toml
app           = "dumpster-inference"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  target     = "inference"

# Fly's 6PN private network is IPv6-only. Binding to 0.0.0.0 (the
# Dockerfile's local-dev default) only opens an IPv4 socket, so api/worker
# reaching this app via "dumpster-inference.internal:8000" got "connection
# refused" despite DNS resolving fine and the process being up — nothing
# was actually listening on the address 6PN traffic arrives on. No
# [[services]] block substitutes for this: per Fly's own docs, 6PN traffic
# bypasses Fly's proxy entirely, so the process itself has to bind the
# address proxy-less private traffic actually lands on.
[env]
  UVICORN_HOST = "fly-local-6pn"
  # Caps PyTorch's (and the underlying BLAS library's) CPU thread count to
  # this machine's actual allocation (shared-cpu-2x, below). Without this,
  # measured directly: embedding 433 chunks for a real document took
  # 13m18s here vs. 47s on a local dev machine for the identical input --
  # a ~17x blowup, far worse than the ~3x slowdown a different, non-torch
  # CPU-bound step (region extraction) saw on this same machine at the
  # same time. PyTorch defaults to one intra-op thread per CPU core it
  # *detects*, which on a shared/throttled vCPU allocation can wildly
  # overshoot the cgroup's real quota -- the container sees more logical
  # CPUs than it's actually granted -- and the resulting over-threading
  # causes scheduling thrashing under throttling, not just a proportional
  # slowdown. See embeddings.py's load_embedder() for where this is read.
  # Not set for local dev (docker-compose), where the default already
  # performs fine on real, uncontended cores.
  OMP_NUM_THREADS      = "2"
  MKL_NUM_THREADS      = "2"
  OPENBLAS_NUM_THREADS = "2"

# Always-on, never scale-to-zero: the whole point of this service is to
# keep the local embedding model warm. A cold start here reintroduces
# exactly the multi-second-to-multi-minute tax this consolidation exists
# to eliminate. Region classification isn't "kept warm" the same way --
# inference_service.py runs each /regions call in its own isolated,
# memory-capped child process rather than in this resident process, so its
# cost shows up as a transient peak (see the memory comment below), not a
# steady-state one.
[[vm]]
  count  = 1
  # shared-cpu-2x, not -1x: Fly caps memory at 2GB per shared vCPU
  # (shared-cpu-1x maxes out at 2048mb — confirmed the hard way, a first
  # deploy attempt at -1x with 4096mb failed outright with "invalid
  # config.guest.memory_mb, cannot exceed 2048 MiB"). -2x's 2 vCPUs are
  # also a genuine, not just incidental, benefit here: this service serving
  # concurrent requests (worker's own concurrency, once local embeddings
  # add query-path traffic on top of ingestion) needs more than one real
  # core to actually run those requests in parallel rather than interleave
  # them on a single shared core.
  size   = "shared-cpu-2x"
  # 4096mb was sized while this process still loaded three models (GLiNER,
  # the layout classifier's dependency stack, and the local embedding
  # model -- 2.69GB RSS measured at the time). Entity extraction has since
  # moved to AWS Batch GPU (see internal/entity/awsbatch), and this process
  # no longer loads GLiNER at all -- the steady-state footprint today is
  # almost certainly smaller, but hasn't been re-measured since the
  # removal, so this value is left unchanged rather than guessed down.
  # Re-measure real RSS (steady-state embedding-model-only, plus peak
  # during an isolated /regions call) before shrinking this.
  memory = "4096mb"
