app = "dumpster"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # Use the combined runtime target so one image serves both process groups.
  target = "runtime"

# Two process groups share one image; the command selects which binary runs.
[processes]
  api    = "/bin/api"
  worker = "/bin/worker"

# Shared non-secret env vars. Secrets (DATABASE_URL, DATABASE_URL_POOLED,
# S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY, ANTHROPIC_API_KEY)
# must be set via `fly secrets set --app dumpster KEY=value`.
[env]
  HTTP_PORT    = "8080"
  METRICS_PORT = "9090"
  S3_REGION    = "auto"
  S3_BUCKET    = "dumpster"
  # Cloudflare R2 S3-compatible endpoint (account-specific, set as secret).
  # S3_ENDPOINT = "https://<account-id>.r2.cloudflarestorage.com"
  S3_USE_PATH_STYLE = "false"
  # Base URL of the consolidated ML inference service, deployed as its own
  # Fly app — see fly.inference.toml. Reached over Fly's private network,
  # not the public internet.
  INFERENCE_SERVICE_URL = "http://dumpster-inference.internal:8000"

  # Routes the worker's entity extraction through AWS Batch (GPU, scale-
  # to-zero) instead of the always-on inference service above. Credentials
  # (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) are already set as Fly
  # secrets — see `fly secrets list --app dumpster`. Only cmd/worker reads
  # these; harmless (just unused) on the api process, which doesn't run
  # entity extraction.
  ENTITY_EXTRACTOR_BACKEND = "awsbatch"
  AWS_REGION               = "us-east-1"
  BATCH_JOB_QUEUE          = "dumpster-batch-gpu-pilot-queue"
  BATCH_JOB_DEFINITION     = "dumpster-entity-extraction"

# Points Fly's built-in Prometheus scraper at the /metrics handler telemetry.Setup
# already serves on METRICS_PORT, enabling Fly's Grafana dashboards with no new code.
[metrics]
  port = 9090
  path = "/metrics"

# HTTP service binds only to the api process group.
# min_machines_running=1 keeps one API machine warm at all times.
[http_service]
  internal_port        = 8080
  force_https          = true
  processes            = ["api"]
  min_machines_running = 1

  [[http_service.checks]]
    grace_period  = "5s"
    interval      = "15s"
    method        = "GET"
    path          = "/healthz"
    timeout       = "2s"

# api: at least one machine always running; can scale up under load.
[[vm]]
  count     = 1
  size      = "shared-cpu-1x"
  memory    = "256mb"
  processes = ["api"]

# worker: persistent process — must never scale to zero because the SKIP LOCKED
# poll loop is a long-lived process, not a per-request handler.
# count=1 sets the initial machine count; to enforce a floor after deploy run:
#   fly scale count 1 --process-group worker --app dumpster
#
# Session sweep scheduling: the worker runs a time.Ticker (default 5 minutes)
# internally, so no external scheduler (Fly cron job, GitHub Actions, etc.) is
# required. Override with SWEEP_INTERVAL env var (e.g. "2m" for staging).
[[vm]]
  count     = 1
  size      = "shared-cpu-1x"
  # 256mb (lowered from 2048mb): the worker no longer embeds any ML model —
  # entity extraction and region classification now call the separate,
  # dedicated inference service (fly.inference.toml) over HTTP instead of
  # running a warm Python subprocess in this process. What's left is a
  # plain Go binary plus in-process job concurrency (default 5 goroutines)
  # — no reason for this to carry multi-GB memory anymore. Revisit if real
  # usage says otherwise; not yet confirmed against actual Fly Linux traffic.
  memory    = "256mb"
  processes = ["worker"]

  # Worker uses the direct Neon connection (no pooler) to support SKIP LOCKED
  # and SET LOCAL RLS calls across longer transactions.
  # Set DATABASE_URL (direct) and DATABASE_URL_POOLED (pooler) as secrets:
  #   fly secrets set DATABASE_URL="postgresql://..." DATABASE_URL_POOLED="postgresql://...pooler..."
