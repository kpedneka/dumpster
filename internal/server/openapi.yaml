openapi: "3.1.0"
info:
  title: Dumpster API
  description: Multimodal knowledge base REST API
  version: "1.0.0"

servers:
  - url: /

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: >-
        An anonymous session cookie minted server-side on the first request.
        No login or registration is required: the API automatically issues a
        new session_id cookie whenever the request arrives without one or
        presents an expired session. The cookie drives RLS isolation so each
        session only sees its own knowledge bases, documents, and chunks.

  schemas:
    KnowledgeBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, user_id, name, created_at, updated_at]

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kb_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        filename:
          type: string
        s3_key:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, processing, indexed, failed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        manifest_summary:
          type: object
          nullable: true
          description: >-
            Set for PDF/image documents once region classification has run.
            Omitted for text/markdown documents and before classification
            completes.
          properties:
            indexed:
              type: integer
            skipped:
              type: integer
            failed:
              type: integer
          required: [indexed, skipped, failed]
        progress:
          type: object
          nullable: true
          description: >-
            Staged ingestion checklist, always ending on a "complete"
            stage. Set for every status except failed (a dead-lettered
            document has nothing left to report), and omitted entirely on
            responses where per-document progress isn't available. Stays
            set forever once a document finishes its whole pipeline --
            including background entity extraction, which keeps running
            after the document is already searchable -- so it doubles as a
            permanent ingestion-history record, not just live progress.
          properties:
            stages:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  label:
                    type: string
                  message:
                    type: string
                required: [key, label]
            current_stage:
              type: string
              description: >-
                The key of the stage currently in progress, matching one of
                stages[].key. Empty when the document is queued but no
                worker has picked it up yet. Permanently "complete" once
                the whole pipeline, including background entity
                extraction, has finished.
          required: [stages]
      required: [id, kb_id, user_id, filename, s3_key, content_type, size_bytes, status, created_at, updated_at]

    Citation:
      type: object
      properties:
        number:
          type: integer
          description: >-
            The 1-indexed [N] marker this citation corresponds to in the
            summary text. Match markers to citations by this field, not by
            array position — the list is sparse whenever the model didn't
            cite every numbered source chunk.
        document_id:
          type: string
          format: uuid
        chunk_id:
          type: string
          format: uuid
        char_start:
          type: integer
        char_end:
          type: integer
        file_name:
          type: string
          description: >-
            The source document's filename — the entire primary citation
            identity, plus locator when present. Citations are grouped and
            displayed by file, not by individual chunk text, mirroring how
            search engines cite the source page rather than a byte range
            within it.
        locator:
          type: object
          nullable: true
          description: >-
            An optional modality-native locator narrowing the citation within
            the file — a page number for PDF-derived chunks. Absent for
            plain-text/markdown chunks. Shaped so a future locator type (e.g.
            a video timestamp) is an additive change, not a schema rework.
          properties:
            type:
              type: string
              enum: [page]
            value:
              type: integer
          required: [type, value]
      required: [number, document_id, chunk_id, char_start, char_end, file_name, locator]

    SearchRetrievedFilesEvent:
      type: object
      description: >-
        Payload of the "retrieved_files" SSE event: fires once, before
        generation begins.
      properties:
        retrieved_files:
          type: array
          description: >-
            Every file the fused top-k retrieval surfaced, ranked, whether
            or not it ends up cited inline in the eventual summary — a
            superset of the files named in the done event's citations.
          items:
            $ref: "#/components/schemas/RetrievedFile"
      required: [retrieved_files]

    SearchDeltaEvent:
      type: object
      description: >-
        Payload of a "delta" SSE event: one chunk of the generated answer
        text, in the order generated. Zero or more of these fire between
        retrieved_files and done.
      properties:
        text:
          type: string
      required: [text]

    SearchDoneEvent:
      type: object
      description: >-
        Payload of the final "done" SSE event: the complete, parsed
        answer. retrieved_files isn't repeated here — it already went out
        as its own event.
      properties:
        summary:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
      required: [summary, citations]

    SearchErrorEvent:
      type: object
      description: >-
        Payload of an "error" SSE event, sent only when the search fails
        after streaming has already started (so the HTTP status can no
        longer change to reflect the failure).
      properties:
        error:
          type: string
      required: [error]

    RetrievedFile:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        file_name:
          type: string
      required: [document_id, file_name]

    InquiryMessage:
      type: object
      description: >-
        One turn in an Inquiry: either the researcher's query (role=user,
        no citations/retrieved_documents) or a generated answer
        (role=assistant). Answers are never overwritten — a re-evaluation
        appends a new message with supersedes_message_id set rather than
        replacing the one it re-answers.
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        retrieved_documents:
          type: array
          items:
            $ref: "#/components/schemas/RetrievedFile"
        supersedes_message_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [id, role, content, citations, retrieved_documents, supersedes_message_id, created_at]

    Inquiry:
      type: object
      description: >-
        The researcher's single persisted thread of turns for one
        knowledge base. id is nullable: a knowledge base with no searches
        run against it yet has no Inquiry, which is a normal state, not
        an error.
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        messages:
          type: array
          items:
            $ref: "#/components/schemas/InquiryMessage"
      required: [id, messages]

    CommunityResult:
      type: object
      description: >-
        A knowledge base's most recent Louvain community-detection run.
        computed_at is null when detection has never been run for this
        knowledge base — a normal first-run state, not an error.
      properties:
        computed_at:
          type: string
          format: date-time
          nullable: true
        modularity:
          type: number
        community_count:
          type: integer
        node_count:
          type: integer
        edge_count:
          type: integer
      required: [computed_at, modularity, community_count, node_count, edge_count]

    Theme:
      type: object
      description: >-
        One LLM-generated label/summary for a notable community. community_id
        is only meaningful relative to the community-detection run active
        when this theme was generated.
      properties:
        community_id:
          type: integer
        label:
          type: string
        summary:
          type: string
        entity_count:
          type: integer
      required: [community_id, label, summary, entity_count]

    ThemeResult:
      type: object
      description: >-
        A knowledge base's most recently generated theme labels. computed_at
        is null when themes have never been generated for this knowledge
        base — a normal first-run state, not an error.
      properties:
        computed_at:
          type: string
          format: date-time
          nullable: true
        themes:
          type: array
          items:
            $ref: "#/components/schemas/Theme"
        note:
          type: string
          description: >-
            A one-line explanation of what set the returned themes apart,
            present only when the knowledge base has more community
            structure than what's shown here. Only ever populated on the
            response to POST — it explains that specific recompute's
            output and isn't persisted, so GET never includes it.
      required: [computed_at, themes]

    KBPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeBase"
        next_cursor:
          type: string
          nullable: true
      required: [items]

    DocumentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        next_cursor:
          type: string
          nullable: true
      required: [items]

    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

paths:
  /healthz:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /openapi.yaml:
    get:
      summary: OpenAPI specification
      security: []
      responses:
        "200":
          description: OpenAPI spec in YAML format
          content:
            application/yaml:
              schema:
                type: string

  /stats:
    get:
      summary: Site-wide usage stats
      description: >
        Aggregate totals across every tenant — not scoped to the caller's
        session. Public and unauthenticated.
      security: []
      responses:
        "200":
          description: Current usage totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents_indexed:
                    type: integer
                  avg_document_size_bytes:
                    type: number
                  queries_executed:
                    type: integer
                  avg_query_duration_ms:
                    type: number
                  sessions_created:
                    type: integer
                  sessions_swept:
                    type: integer

  /account/status:
    get:
      summary: Get the current session's expiry status
      description: >-
        Backs the in-app warning banner. warning_active becomes true within
        the final warning window before the session is swept; deletes_at is
        the earlier of the idle-timeout expiry and the hard-cap expiry.
      responses:
        "200":
          description: Account TTL status
          content:
            application/json:
              schema:
                type: object
                properties:
                  warning_active:
                    type: boolean
                  deletes_at:
                    type: string
                    format: date-time
                required: [warning_active, deletes_at]

  /kbs:
    get:
      summary: List knowledge bases
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
        - in: query
          name: after
          schema:
            type: string
            format: uuid
          description: Cursor — UUID of the last item from the previous page
      responses:
        "200":
          description: Paginated list of knowledge bases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBPage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create a knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        "201":
          description: Knowledge base created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get a knowledge base
      responses:
        "200":
          description: Knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      summary: Rename a knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        "200":
          description: Updated knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a knowledge base
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{id}/search:
    post:
      summary: Search a knowledge base
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
              required: [query]
      responses:
        "200":
          description: >-
            A Server-Sent Events stream, not a single JSON body — OpenAPI
            has no first-class way to express this, so the shape is
            documented here instead of in `content`. Frames arrive in this
            order: exactly one "retrieved_files" event
            (SearchRetrievedFilesEvent) once retrieval finishes, then zero
            or more "delta" events (SearchDeltaEvent) as the answer is
            generated, then exactly one of "done" (SearchDoneEvent) or
            "error" (SearchErrorEvent, only possible once streaming has
            already started — see the 500 response for a failure before
            that point). Each frame is `event: <name>\ndata: <json>\n\n`.
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            Search failed before any event was streamed (e.g. retrieval
            itself failed) — a normal JSON error, since nothing has been
            written yet at this point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{id}/communities:
    get:
      summary: Get a knowledge base's most recent community-detection result
      description: >-
        Returns a zero-value result (null computed_at) rather than a 404
        when community detection has never been run for this knowledge
        base yet — that's a normal first-run state, not an error.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The knowledge base's community-detection summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Recompute community detection over a knowledge base's entity graph
      description: >-
        Manually triggered, synchronous: runs Louvain community detection
        over the canonical-entity graph and fully replaces the previous
        result. Not run automatically on document upload/delete.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The new community-detection summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            The knowledge base has too many canonical entities to compute
            communities synchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: Community detection did not finish within the configured deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{id}/themes:
    get:
      summary: Get a knowledge base's most recently generated theme labels
      description: >-
        Returns a zero-value result (null computed_at, empty themes) rather
        than a 404 when themes have never been generated for this
        knowledge base yet — that's a normal first-run state, not an error.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The knowledge base's theme labels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: >-
        Generate short LLM labels for a knowledge base's largest entity
        communities
      description: >-
        Manually triggered: selects the largest communities found by the
        most recent community-detection run and generates a short label
        and one-sentence summary for each, fully replacing whatever themes
        were there before. Requires community detection to have already
        been run at least once for this knowledge base.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The newly generated theme labels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            Community detection has never been run for this knowledge base,
            so there are no communities to generate themes from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{id}/inquiry:
    get:
      summary: Get the researcher's Inquiry (turn history) for a knowledge base
      description: >-
        Returns an empty Inquiry (null id, no messages) rather than a 404
        when no search has been run against this knowledge base yet —
        that's a normal state, not an error.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The Inquiry for this knowledge base.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{id}/inquiry/messages/{messageId}/reevaluate:
    post:
      summary: >-
        Re-run the query behind a past assistant message against the
        current knowledge base state
      description: >-
        Appends a new assistant message rather than overwriting the
        original — seeing that an answer changed is often as valuable as
        the new answer itself. messageId must identify an assistant-role
        message in the caller's Inquiry for this knowledge base; the query
        re-run is the content of the user message that originally prompted
        it. Same event stream shape as POST /kbs/{id}/search.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >-
            A Server-Sent Events stream identical in shape to POST
            /kbs/{id}/search's 200 response.
        "400":
          description: >-
            messageId does not identify a re-evaluatable assistant message
            (unknown, a user-role message, or the first message in the
            inquiry).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            Knowledge base not found, or no Inquiry exists yet for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            Search failed before any event was streamed — a normal JSON
            error, since nothing has been written yet at this point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{kbId}/documents:
    parameters:
      - in: path
        name: kbId
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: List documents in a knowledge base
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
        - in: query
          name: after
          schema:
            type: string
            format: uuid
          description: Cursor — UUID of the last item from the previous page
      responses:
        "200":
          description: Paginated list of documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Upload a document
      description: >-
        Accepts .txt and .md files (text pipeline) plus .pdf, .png, .jpg (region-
        classification pipeline: pdfplumber + unstructured.io layout analysis).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: Document created and queued for indexing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Unsupported file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{kbId}/documents/{docId}:
    parameters:
      - in: path
        name: kbId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: docId
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get a document (including its status)
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a document
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Document is being indexed and cannot be deleted yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{kbId}/documents/{docId}/retry:
    parameters:
      - in: path
        name: kbId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: docId
        required: true
        schema:
          type: string
          format: uuid

    post:
      summary: Re-enqueue a dead-lettered (failed) document for processing
      description: >-
        Reuses the object already in storage — no re-upload needed. Only
        valid for a document whose status is "failed"; anything else returns
        409.
      responses:
        "200":
          description: Document reset to pending and re-enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Document is not in a failed state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{kbId}/documents/{docId}/content:
    parameters:
      - in: path
        name: kbId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: docId
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get the raw text content of a document
      responses:
        "200":
          description: Raw document text
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
