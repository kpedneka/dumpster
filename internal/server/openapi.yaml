openapi: "3.1.0"
info:
  title: Dumpster API
  description: Multimodal knowledge base REST API
  version: "1.0.0"

servers:
  - url: /

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: >-
        An anonymous session cookie minted server-side on the first request.
        No login or registration is required: the API automatically issues a
        new session_id cookie whenever the request arrives without one or
        presents an expired session. The cookie drives RLS isolation so each
        session only sees its own knowledge bases, documents, and chunks.

  schemas:
    KnowledgeBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, user_id, name, created_at, updated_at]

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kb_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        filename:
          type: string
        s3_key:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, processing, indexed, failed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        manifest_summary:
          type: object
          nullable: true
          description: >-
            Set for PDF/image documents once region classification has run.
            Omitted for text/markdown documents and before classification
            completes.
          properties:
            indexed:
              type: integer
            skipped:
              type: integer
            failed:
              type: integer
          required: [indexed, skipped, failed]
      required: [id, kb_id, user_id, filename, s3_key, content_type, size_bytes, status, created_at, updated_at]

    Citation:
      type: object
      properties:
        number:
          type: integer
          description: >-
            The 1-indexed [N] marker this citation corresponds to in the
            summary text. Match markers to citations by this field, not by
            array position — the list is sparse whenever the model didn't
            cite every numbered source chunk.
        document_id:
          type: string
          format: uuid
        chunk_id:
          type: string
          format: uuid
        char_start:
          type: integer
        char_end:
          type: integer
        file_name:
          type: string
          description: >-
            The source document's filename — the entire primary citation
            identity, plus locator when present. Citations are grouped and
            displayed by file, not by individual chunk text, mirroring how
            search engines cite the source page rather than a byte range
            within it.
        locator:
          type: object
          nullable: true
          description: >-
            An optional modality-native locator narrowing the citation within
            the file — a page number for PDF-derived chunks. Absent for
            plain-text/markdown chunks. Shaped so a future locator type (e.g.
            a video timestamp) is an additive change, not a schema rework.
          properties:
            type:
              type: string
              enum: [page]
            value:
              type: integer
          required: [type, value]
      required: [number, document_id, chunk_id, char_start, char_end, file_name, locator]

    SearchRetrievedFilesEvent:
      type: object
      description: >-
        Payload of the "retrieved_files" SSE event: fires once, before
        generation begins.
      properties:
        retrieved_files:
          type: array
          description: >-
            Every file the fused top-k retrieval surfaced, ranked, whether
            or not it ends up cited inline in the eventual summary — a
            superset of the files named in the done event's citations.
          items:
            $ref: "#/components/schemas/RetrievedFile"
      required: [retrieved_files]

    SearchDeltaEvent:
      type: object
      description: >-
        Payload of a "delta" SSE event: one chunk of the generated answer
        text, in the order generated. Zero or more of these fire between
        retrieved_files and done.
      properties:
        text:
          type: string
      required: [text]

    SearchDoneEvent:
      type: object
      description: >-
        Payload of the final "done" SSE event: the complete, parsed
        answer. retrieved_files isn't repeated here — it already went out
        as its own event.
      properties:
        summary:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
      required: [summary, citations]

    SearchErrorEvent:
      type: object
      description: >-
        Payload of an "error" SSE event, sent only when the search fails
        after streaming has already started (so the HTTP status can no
        longer change to reflect the failure).
      properties:
        error:
          type: string
      required: [error]

    RetrievedFile:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        file_name:
          type: string
      required: [document_id, file_name]

    KBPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeBase"
        next_cursor:
          type: string
          nullable: true
      required: [items]

    DocumentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        next_cursor:
          type: string
          nullable: true
      required: [items]

    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

paths:
  /healthz:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /openapi.yaml:
    get:
      summary: OpenAPI specification
      security: []
      responses:
        "200":
          description: OpenAPI spec in YAML format
          content:
            application/yaml:
              schema:
                type: string

  /account/status:
    get:
      summary: Get the current session's expiry status
      description: >-
        Backs the in-app warning banner. warning_active becomes true within
        the final warning window before the session is swept; deletes_at is
        the earlier of the idle-timeout expiry and the hard-cap expiry.
      responses:
        "200":
          description: Account TTL status
          content:
            application/json:
              schema:
                type: object
                properties:
                  warning_active:
                    type: boolean
                  deletes_at:
                    type: string
                    format: date-time
                required: [warning_active, deletes_at]

  /kbs:
    get:
      summary: List knowledge bases
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
        - in: query
          name: after
          schema:
            type: string
            format: uuid
          description: Cursor — UUID of the last item from the previous page
      responses:
        "200":
          description: Paginated list of knowledge bases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBPage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create a knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        "201":
          description: Knowledge base created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get a knowledge base
      responses:
        "200":
          description: Knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      summary: Rename a knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        "200":
          description: Updated knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a knowledge base
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{id}/search:
    post:
      summary: Search a knowledge base
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
              required: [query]
      responses:
        "200":
          description: >-
            A Server-Sent Events stream, not a single JSON body — OpenAPI
            has no first-class way to express this, so the shape is
            documented here instead of in `content`. Frames arrive in this
            order: exactly one "retrieved_files" event
            (SearchRetrievedFilesEvent) once retrieval finishes, then zero
            or more "delta" events (SearchDeltaEvent) as the answer is
            generated, then exactly one of "done" (SearchDoneEvent) or
            "error" (SearchErrorEvent, only possible once streaming has
            already started — see the 500 response for a failure before
            that point). Each frame is `event: <name>\ndata: <json>\n\n`.
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            Search failed before any event was streamed (e.g. retrieval
            itself failed) — a normal JSON error, since nothing has been
            written yet at this point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{kbId}/documents:
    parameters:
      - in: path
        name: kbId
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: List documents in a knowledge base
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
        - in: query
          name: after
          schema:
            type: string
            format: uuid
          description: Cursor — UUID of the last item from the previous page
      responses:
        "200":
          description: Paginated list of documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Upload a document
      description: >-
        Accepts .txt and .md files (text pipeline) plus .pdf, .png, .jpg (region-
        classification pipeline: pdfplumber + unstructured.io layout analysis).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: Document created and queued for indexing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Unsupported file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{kbId}/documents/{docId}:
    parameters:
      - in: path
        name: kbId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: docId
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get a document (including its status)
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a document
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Document is being indexed and cannot be deleted yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{kbId}/documents/{docId}/retry:
    parameters:
      - in: path
        name: kbId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: docId
        required: true
        schema:
          type: string
          format: uuid

    post:
      summary: Re-enqueue a dead-lettered (failed) document for processing
      description: >-
        Reuses the object already in storage — no re-upload needed. Only
        valid for a document whose status is "failed"; anything else returns
        409.
      responses:
        "200":
          description: Document reset to pending and re-enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Document is not in a failed state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{kbId}/documents/{docId}/content:
    parameters:
      - in: path
        name: kbId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: docId
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get the raw text content of a document
      responses:
        "200":
          description: Raw document text
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
