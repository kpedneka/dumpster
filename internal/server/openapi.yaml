openapi: "3.1.0"
info:
  title: Dumpster API
  description: Multimodal knowledge base REST API
  version: "1.0.0"

servers:
  - url: /

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    KnowledgeBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, user_id, name, created_at, updated_at]

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kb_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        filename:
          type: string
        s3_key:
          type: string
        content_type:
          type: string
        status:
          type: string
          enum: [pending, processing, indexed, failed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, kb_id, user_id, filename, s3_key, content_type, status, created_at, updated_at]

    Citation:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        chunk_id:
          type: string
          format: uuid
        char_start:
          type: integer
        char_end:
          type: integer
      required: [document_id, chunk_id, char_start, char_end]

    SearchResult:
      type: object
      properties:
        summary:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
      required: [summary, citations]

    KBPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeBase"
        next_cursor:
          type: string
          nullable: true
      required: [items]

    DocumentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        next_cursor:
          type: string
          nullable: true
      required: [items]

    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

paths:
  /healthz:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /openapi.yaml:
    get:
      summary: OpenAPI specification
      security: []
      responses:
        "200":
          description: OpenAPI spec in YAML format
          content:
            application/yaml:
              schema:
                type: string

  /kbs:
    get:
      summary: List knowledge bases
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
        - in: query
          name: after
          schema:
            type: string
            format: uuid
          description: Cursor — UUID of the last item from the previous page
      responses:
        "200":
          description: Paginated list of knowledge bases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBPage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create a knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        "201":
          description: Knowledge base created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get a knowledge base
      responses:
        "200":
          description: Knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      summary: Rename a knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        "200":
          description: Updated knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBase"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a knowledge base
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{id}/search:
    post:
      summary: Search a knowledge base
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
              required: [query]
      responses:
        "200":
          description: Search result with cited summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Search failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{kbId}/documents:
    parameters:
      - in: path
        name: kbId
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: List documents in a knowledge base
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 200
        - in: query
          name: after
          schema:
            type: string
            format: uuid
          description: Cursor — UUID of the last item from the previous page
      responses:
        "200":
          description: Paginated list of documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Upload a document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: Document created and queued for indexing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Knowledge base not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Unsupported file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /kbs/{kbId}/documents/{docId}:
    parameters:
      - in: path
        name: kbId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: docId
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get a document (including its status)
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a document
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
