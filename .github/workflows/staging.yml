# Ephemeral staging: spins up a real AWS staging environment for a PR,
# smoke-tests it, and tears it down -- gated by the deploy-staging label
# (see CLAUDE.md's Local workflow section and the "design the staging
# spin-up/test/tear-down workflow" dev board card), not automatic on
# every PR, since applying this config starts real AWS billing.
#
# Only one staging environment exists in this AWS account (see the
# concurrency block below) -- it's a shared, personal-scale resource, not
# one-per-PR. Two PRs both carrying the label at once would otherwise
# race to apply/destroy the same OpenTofu state; the concurrency group
# below serializes every run onto a single queue instead, across every
# PR, not just repeat pushes to the same one.

name: Staging (ephemeral)

on:
  pull_request:
    types: [labeled, unlabeled, synchronize]

permissions:
  id-token: write # required for aws-actions/configure-aws-credentials' OIDC exchange
  contents: read
  pull-requests: read

concurrency:
  group: staging-environment
  cancel-in-progress: false # never cancel mid-apply/destroy -- a killed run can orphan real AWS resources

env:
  AWS_REGION: us-east-1
  TF_VAR_environment: staging
  TF_VAR_acm_domain_name: ${{ vars.STAGING_ACM_DOMAIN }}
  # dns.tf's cloudflare_dns_record.staging repoints this domain at each
  # cycle's fresh CloudFront distribution -- the Cloudflare provider reads
  # this env var automatically (see dns.tf's provider block comment).
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # run_id + run_attempt, not just the commit SHA: ECR's repos are
  # immutable-tag mode (ecs_ecr.tf), so a plain PR+SHA tag collides on
  # retry -- both a same-run retry (run_attempt covers that alone) and a
  # relabel-without-a-new-commit, which gets a fresh run_id with the
  # identical PR number + SHA (run_attempt alone doesn't cover that
  # second, equally real path to the same collision).
  TF_VAR_image_tag: pr-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # Normal path: PR carries the label (either just added, or a new commit
  # landed on an already-labeled PR) -- build real images, apply staging,
  # smoke test, then always tear down regardless of outcome.
  deploy-and-test:
    if: github.event.action != 'unlabeled' && contains(github.event.pull_request.labels.*.name, 'deploy-staging')
    # Native arm64 runner, not ubuntu-latest (amd64) + QEMU emulation --
    # found painfully slow by a real run (PR #94): QEMU emulates every
    # instruction and syscall for CPU-bound work like `go build`, and a
    # Go compiler is syscall-heavy (lots of file I/O). What measured
    # ~70s natively (api+worker+cleanup combined) stretched past 25
    # minutes under emulation without finishing. GitHub's own hosted
    # arm64 Linux runners avoid the emulation question entirely --
    # native compilation, no QEMU, no docker/setup-qemu-action step
    # needed at all.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dumpster-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      # Built and pushed before `tofu apply`, not after -- ECS tasks
      # would otherwise try to pull an image tag that doesn't exist yet
      # the moment the new task definition revision rolls out.
      #
      # platforms: linux/arm64, explicitly -- found missing only by a
      # real ECS task actually failing to start (PR #94):
      # docker/build-push-action defaults to the runner's own platform
      # when this isn't set, which is amd64 on every GitHub-hosted
      # runner, not the arm64 these task definitions require (ecs_api.tf/
      # ecs_worker.tf's runtime_platform block, matching the image
      # previously built on Apple Silicon). The resulting manifest had no
      # arm64 descriptor at all -- confirmed directly via `docker buildx
      # imagetools inspect` -- not a base-image limitation (python:3.11-
      # slim, alpine:3.20, golang:1.25-alpine, and node:22-slim all
      # publish real arm64 variants, checked directly too).
      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/dumpster-staging-runtime:${{ env.TF_VAR_image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push embed-sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.batch-embed-job
          target: sidecar
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/dumpster-staging-embed-sidecar:${{ env.TF_VAR_image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The metrics sidecar (see the "Push OTel metrics to CloudWatch" dev
      # board card). No target platform override needed here unlike the two
      # builds above: this Dockerfile has no build stage of its own, just
      # COPYs a config file onto AWS's own public ADOT image, which already
      # publishes real arm64 manifests.
      - name: Build and push otel-collector image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.otel-collector
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/dumpster-staging-otel-collector:${{ env.TF_VAR_image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Built before `tofu apply`, same ordering reasoning as the three
      # Docker images above: terraform/lambda_stateless_jobs.tf's
      # archive_file just zips whatever's already on disk at this path,
      # it can't compile Go itself.
      #
      # GOARCH=arm64, matching every other compute resource in this
      # config (runtime_platform blocks, the NAT instance's Graviton
      # instance type) -- and CGO_ENABLED=0 for a fully static binary,
      # since Lambda's provided.al2023 runtime has no guarantee of the
      # same shared libraries a `go build` might otherwise dynamically
      # link against.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build lambda-stateless-jobs
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -o build/lambda-stateless-jobs/bootstrap ./cmd/lambda-stateless-jobs

      - name: Init
        working-directory: terraform
        run: tofu init

      - name: Select staging workspace
        working-directory: terraform
        run: tofu workspace select -or-create staging

      - name: Plan
        working-directory: terraform
        run: tofu plan -out=tfplan

      - name: Apply
        working-directory: terraform
        run: tofu apply -auto-approve tfplan

      # Real, pre-existing gap this pipeline had until now, found live:
      # nothing ever built or synced the frontend to S3 for a staging
      # deploy -- only the backend (api/worker/cleanup images) got
      # deployed. The root path (`/`, CloudFront's S3 cache behavior --
      # frontend.tf) has never actually served a real build; `/healthz`
      # (routed straight to the ALB instead) was the only path anyone had
      # ever actually verified. An empty, OAC-fronted bucket returns a
      # generic S3 AccessDenied for any object, not a 404 -- a real, if
      # confusing, AWS behavior (avoids leaking object-existence info to
      # an unauthorized requester), which is what made this look like a
      # permissions bug rather than "there's just nothing here yet."
      #
      # No env vars needed at build time (web/.env.example: the frontend
      # only ever calls a same-origin, relative /api path -- see
      # client.ts), so this build is identical regardless of environment.
      # No CloudFront invalidation needed either: staging's distribution
      # is destroyed and recreated every cycle (frontend.tf), so it never
      # has a stale cached response to invalidate in the first place --
      # unlike a long-lived distribution (production), this one's cache
      # starts empty on every deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Sync frontend to S3
        working-directory: terraform
        run: |
          BUCKET=$(tofu output -raw frontend_bucket_name)
          aws s3 sync ../web/dist/ "s3://$BUCKET/" --delete

      # tofu apply only waits for the EC2 API to report the NAT instance
      # exists, not for its user_data to finish installing/configuring
      # iptables (ecs_networking.tf) -- real wall-clock time after that.
      # Waited for explicitly here, same reasoning as the ECS-stabilize
      # step below: ECS tasks that start before this finishes fail with
      # ResourceInitializationError trying to reach Secrets Manager/ECR/
      # CloudWatch Logs/Neon through a NAT path that isn't routing yet.
      # See scripts/wait_for_nat_ready.sh for the actual check.
      - name: Wait for NAT instance to be ready
        working-directory: terraform
        run: |
          NAT_INSTANCE_ID=$(tofu output -raw nat_instance_id)
          export NAT_INSTANCE_ID
          bash ../scripts/wait_for_nat_ready.sh

      # tofu apply returns as soon as the ECS service/task-definition API
      # calls succeed, not once tasks are actually running and passing
      # the ALB's health check -- a real gap the manual runbook doesn't
      # hit (a human naturally waits and re-checks by hand). Waited for
      # explicitly here so the smoke test below doesn't race a still-
      # starting deployment.
      # `aws ecs wait services-stable`'s own timeout is fixed (15s delay x
      # 40 attempts = 10 minutes) and not configurable via a CLI flag.
      # Originally three attempts (~30 min total runway): the NAT
      # instance's cold-start-before-routing race (PR #94) used to eat
      # most of a whole 10-minute window on its own before this step ever
      # got a chance to stabilize. The step above now closes that race
      # with a real, positive-confirmation check before this one even
      # starts, so this loop's remaining job is a narrower one: the
      # occasional, separate case of Fargate capacity being briefly
      # unavailable in an AZ (also noted in the cleanup-cron design docs).
      # Two attempts (~20 min) keeps real margin for that genuinely
      # different failure mode without carrying the padding that was only
      # ever there for the NAT race.
      - name: Wait for ECS services to stabilize
        run: |
          for i in 1 2; do
            if aws ecs wait services-stable --cluster dumpster-staging --services api worker; then
              echo "services stable"
              exit 0
            fi
            echo "attempt $i: not stable within this wait window, retrying..."
          done
          echo "::error::ECS services never reached steady state"
          exit 1

      # The direct-ALB smoke test this replaced (curling the ALB's own DNS
      # name, bypassing CloudFront on purpose to test the backend
      # independently) no longer works at all: the ALB is now internal, in
      # private subnets with no public IP (ecs_alb.tf's VPC-origins
      # migration) -- a deliberate tradeoff, not an oversight. The
      # GitHub Actions runner has no path into the VPC to reach a private
      # ALB directly. The CloudFront-based check below is now the only
      # smoke test; see frontend.tf's wait_for_deployment comment for
      # why this needs its own (much longer) retry window: staging's
      # distribution is created from scratch every cycle with
      # wait_for_deployment = false, so `tofu apply` returns before global
      # edge propagation (confirmed directly against AWS's docs: 5-20+
      # minutes) actually finishes, unlike production which waits for a
      # real "Deployed" state. /healthz specifically: that cache behavior
      # routes straight to the ALB (frontend.tf) regardless of whether the
      # S3 bucket has the built frontend synced into it yet, so this check
      # is meaningful on its own without depending on a frontend deploy
      # step. 90 attempts x 20s = 30 minutes of runway, matching this
      # workflow's existing "give real AWS propagation generous, not
      # padded-once, time" pattern (see the ECS-stabilize step above).
      #
      # Tests via the real alias domain (dns.tf's STAGING_ACM_DOMAIN),
      # resolved straight to CloudFront's own default-domain IP with
      # --resolve, not through real DNS -- Cloudflare's record update
      # (this same apply) is typically near-instant, but this check must
      # not depend on that propagation timing at all. Found live: curling
      # the plain *.cloudfront.net default domain directly, as this step
      # used to, gets a real 502 from CloudFront itself -- the VPC origin
      # (ecs_alb.tf) still does real TLS validation against the ALB's own
      # certificate, which only covers the real alias, not the default
      # domain, so the SNI/Host CloudFront forwards has to be the real
      # alias for the handshake to succeed at all. Same `--resolve` trick
      # already proven manually earlier in this migration for exactly this
      # class of check, now made a permanent, automated part of this step.
      - name: Smoke test
        working-directory: terraform
        run: |
          CF_DOMAIN=$(tofu output -raw cloudfront_domain_name)
          ALIAS_DOMAIN="${{ vars.STAGING_ACM_DOMAIN }}"
          for i in $(seq 1 90); do
            CF_IP=$(dig +short "$CF_DOMAIN" | head -1)
            if [[ -n "$CF_IP" ]] && curl -s --resolve "$ALIAS_DOMAIN:443:$CF_IP" -o /dev/null -w '%{http_code}' "https://$ALIAS_DOMAIN/healthz" | grep -q 200; then
              echo "CloudFront healthz OK (via $ALIAS_DOMAIN resolved to $CF_IP)"
              exit 0
            fi
            echo "attempt $i: not ready yet, retrying..."
            sleep 20
          done
          echo "::error::CloudFront never started serving /healthz"
          exit 1

      # Prints the real alias URL, not CloudFront's default domain -- a
      # human's browser can't do the --resolve trick the smoke test above
      # uses, and it doesn't need to: dns.tf's cloudflare_dns_record.staging
      # (this same apply) repoints dumpster-staging.kpednekar.dev at this
      # cycle's fresh distribution for real, so the plain URL below now
      # actually works. It didn't before this card -- that record was
      # stale, pointing at a torn-down architecture from before the
      # VPC-origins migration, silently broken for manual testing this
      # whole time despite the smoke test above passing.
      - name: Staging is up
        if: success()
        working-directory: terraform
        run: |
          {
            echo "### Staging is up for manual testing"
            echo ""
            echo "URL: https://${{ vars.STAGING_ACM_DOMAIN }}/"
            echo ""
            echo ""
            echo "Remove the \`deploy-staging\` label from this PR when done -- that tears it down (see teardown-on-unlabel)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Only runs on failure/cancellation now, not always() -- a crashed
      # run still must not leak paid resources, but a *successful* one is
      # left running on purpose so it can actually be looked at by a
      # human, not just smoke-tested by curl. Real gap in the original
      # design, caught by direct feedback, not anticipated: destroying
      # immediately after every green run meant staging was never
      # actually usable for manual testing, which was the whole point of
      # standing up a real environment rather than only running unit
      # tests. Teardown now happens explicitly, later, by removing the
      # deploy-staging label -- reusing teardown-on-unlabel below, which
      # already existed for a different edge case and turns out to be
      # exactly the right mechanism for this too.
      - name: Destroy staging
        if: failure() || cancelled()
        working-directory: terraform
        run: |
          tofu init
          tofu workspace select staging
          tofu destroy -auto-approve

  # Edge case the normal path doesn't cover: the label gets removed with
  # no new commit pushed afterward, so no "labeled"/"synchronize" event
  # fires to trigger the always()-destroy above. Runs a destroy-only path
  # instead, so removing the label is itself enough to tear the
  # environment down, not just adding it enough to spin one up.
  teardown-on-unlabel:
    if: github.event.action == 'unlabeled' && github.event.label.name == 'deploy-staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dumpster-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy staging
        working-directory: terraform
        run: |
          tofu init
          tofu workspace select -or-create staging
          tofu destroy -auto-approve
