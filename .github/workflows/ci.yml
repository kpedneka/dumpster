name: CI

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: |
          go test ./...
          go test ./internal/... -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | grep total | awk '{gsub(/%/,""); if ($3+0 < 80) {print "::error::coverage " $3 "% is below 80% threshold"; exit 1}}'

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.11.3
