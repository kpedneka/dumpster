name: CI

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: |
          go test ./...
          # pgstore, db, s3store, llm/anthropic, llm/openai, entity/gliner require external
          # services/processes; covered by integration tests, not the unit gate.
          CORE=./internal/auth,./internal/config,./internal/server,./internal/llm,./internal/llm/mock,./internal/kb,./internal/kb/memory,./internal/document,./internal/document/memory,./internal/chunk,./internal/chunk/memory,./internal/entity,./internal/entity/memory,./internal/entity/mock,./internal/objectstore,./internal/objectstore/mock,./internal/queue,./internal/queue/memory,./internal/rls,./internal/retrieval,./internal/retrieval/memory,./internal/search,./internal/search/mock
          go test -coverpkg=$CORE -coverprofile=coverage.out -covermode=atomic \
            ./internal/auth ./internal/config ./internal/server ./internal/llm \
            ./internal/kb ./internal/document ./internal/chunk ./internal/entity \
            ./internal/objectstore \
            ./internal/rls ./internal/retrieval ./internal/retrieval/memory \
            ./internal/search
          go tool cover -func=coverage.out | grep total | awk '{gsub(/%/,""); if ($3+0 < 80) {print "::error::coverage " $3 "% is below 80% threshold"; exit 1}}'

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3

  web-build-test-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check & build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
