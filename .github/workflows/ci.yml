name: CI

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: |
          go test ./...
          # pgstore, db, s3store,
          # session/pgstore require external services/processes; covered by
          # integration tests, not the unit gate. manifest/layout,
          # llm/inference, and llm/anthropic are HTTP-client adapters
          # tested with httptest / a fake http.RoundTripper — no
          # external process or real API key needed, so they're in the unit
          # gate. reembed and canonicalize only touch memory/mock
          # repositories in their tests, so they're in the unit gate too.
          # entity/awsbatch (the sole entity.Extractor implementation — no
          # HTTP-service fallback exists) is tested entirely against
          # internal/awsbatch/mock and internal/objectstore/mock, same idea
          # — real AWS access only lives in internal/awsbatch/client.go,
          # excluded below alongside s3store since it can't be exercised
          # without live AWS.
          CORE=./internal/auth,./internal/session,./internal/session/mock,./internal/account,./internal/account/mock,./internal/config,./internal/server,./internal/graphedge,./internal/graphedge/memory,./internal/manifest,./internal/manifest/memory,./internal/manifest/layout,./internal/llm,./internal/llm/mock,./internal/llm/inference,./internal/llm/anthropic,./internal/kb,./internal/kb/memory,./internal/document,./internal/document/memory,./internal/chunk,./internal/chunk/memory,./internal/entity,./internal/entity/memory,./internal/entity/mock,./internal/entity/awsbatch,./internal/awsbatch/mock,./internal/canonical,./internal/canonical/memory,./internal/canonicalize,./internal/inquiry,./internal/inquiry/memory,./internal/reembed,./internal/objectstore,./internal/objectstore/mock,./internal/queue,./internal/queue/memory,./internal/rls,./internal/retrieval,./internal/retrieval/memory,./internal/search,./internal/search/mock,./internal/worker,./internal/router,./internal/router/mock,./internal/graphrag,./internal/graphrag/memory,./internal/ratelimit,./internal/ratelimit/memory,./internal/ratelimit/mock,./internal/stats,./internal/stats/memory,./internal/community,./internal/community/memory,./internal/theme,./internal/theme/memory,./internal/intrusion,./internal/intrusion/memory,./internal/relation,./internal/relation/memory
          go test -coverpkg=$CORE -coverprofile=coverage.out -covermode=atomic \
            ./internal/auth ./internal/account ./internal/config ./internal/server ./internal/graphedge ./internal/manifest ./internal/manifest/layout ./internal/llm ./internal/llm/inference ./internal/llm/anthropic \
            ./internal/kb ./internal/document ./internal/chunk ./internal/entity ./internal/entity/awsbatch ./internal/canonical ./internal/canonicalize ./internal/inquiry ./internal/reembed \
            ./internal/objectstore ./internal/worker \
            ./internal/rls ./internal/retrieval ./internal/retrieval/memory \
            ./internal/search ./internal/router ./internal/graphrag/memory \
            ./internal/ratelimit ./internal/ratelimit/memory \
            ./internal/stats ./internal/stats/memory \
            ./internal/community ./internal/community/memory ./internal/theme ./internal/theme/memory \
            ./internal/intrusion ./internal/intrusion/memory \
            ./internal/relation ./internal/relation/memory
          go tool cover -func=coverage.out | grep total | awk '{gsub(/%/,""); if ($3+0 < 80) {print "::error::coverage " $3 "% is below 80% threshold"; exit 1}}'

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3

  web-build-test-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check & build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
