name: CI

on:
  push:
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: |
          go test ./...
          # Adapter and infra packages (pgstore, db, llm/anthropic, llm/openai) require
          # external services; they are covered by integration tests, not the unit gate.
          CORE=./internal/auth,./internal/config,./internal/server,./internal/llm,./internal/llm/mock
          go test -coverpkg=$CORE -coverprofile=coverage.out -covermode=atomic \
            ./internal/auth ./internal/config ./internal/server ./internal/llm
          go tool cover -func=coverage.out | grep total | awk '{gsub(/%/,""); if ($3+0 < 80) {print "::error::coverage " $3 "% is below 80% threshold"; exit 1}}'

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
