version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dumpster
      POSTGRES_USER: dumpster
      POSTGRES_PASSWORD: dumpster
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dumpster"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    environment:
      HTTP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: dumpster
      DB_USER: dumpster
      DB_PASSWORD: dumpster
      DB_SSLMODE: disable
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: auto
      S3_BUCKET: dumpster
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: dumpster
      DB_USER: dumpster
      DB_PASSWORD: dumpster
      DB_SSLMODE: disable
      S3_ENDPOINT: "http://minio:9000"
      S3_REGION: auto
      S3_BUCKET: dumpster
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_PATH_STYLE: "true"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_EMBED_MODEL: "text-embedding-3-small"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
