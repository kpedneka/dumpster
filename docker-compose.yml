version: "3.9"

# Credentials and connection strings are loaded from .env then .env.local
# (.env.local values override .env for the same key).
# Neither file is required — missing files are skipped.

services:
  api:
    build:
      context: .
      target: api
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      target: worker
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
