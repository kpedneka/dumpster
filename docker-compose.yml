# Credentials and connection strings are loaded from .env then .env.local
# (.env.local values override .env for the same key).
# Neither file is required — missing files are skipped.

services:
  api:
    build:
      context: .
      target: runtime
    command: ["/bin/api"]
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      target: runtime
    command: ["/bin/worker"]
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    depends_on:
      - inference

  # inference (v4.8) is the consolidated, always-on ML service: entity
  # extraction, PDF region classification, and local embeddings behind one
  # HTTP API. api and worker both call it over the network instead of
  # embedding their own warm Python subprocess (the pattern this replaces).
  inference:
    build:
      context: .
      target: inference
    ports:
      - "8000:8000"
