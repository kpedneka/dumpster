# Credentials and connection strings are loaded from .env then .env.local
# (.env.local values override .env for the same key).
# Neither file is required — missing files are skipped.

services:
  api:
    build:
      context: .
      target: runtime
    command: ["/bin/api"]
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    ports:
      - "8080:8080"

  # inference serves query-time embeddings to the api over HTTP. Ingestion
  # (chunking, embedding, entity extraction, region classification) runs on
  # the pipeline-only dev stack in AWS instead: `make dev-deploy`, then
  # `make dev-env` for the .env.local lines.
  inference:
    build:
      context: .
      target: inference
    ports:
      - "8000:8000"
