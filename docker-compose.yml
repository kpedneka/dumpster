# Credentials and connection strings are loaded from .env then .env.local
# (.env.local values override .env for the same key).
# Neither file is required — missing files are skipped.

services:
  api:
    build:
      context: .
      target: runtime
    command: ["/bin/api"]
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      target: runtime
    command: ["/bin/worker"]
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      # .env.local sets this to a host-machine virtualenv path
      # (scripts/.venv/bin/python3) for running `go run ./cmd/worker`
      # directly on the host. env_file above loads that same file for its
      # DB/S3 credentials, which incidentally drags this host-only path in
      # too — but the container has no virtualenv; everything installs into
      # the system Python. Override back to the container-correct default
      # (matching internal/config's own default when this var is unset).
      # This also fixes region classification, not just entity extraction:
      # layout.Extractor reuses this same interpreter path.
      - ENTITY_EXTRACTOR_PYTHON=python3
